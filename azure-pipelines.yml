trigger:
  batch: true
  branches:
    include:
      - legacy

variables:
  - name: ConvertNetCore
    value: false

resources:
  repositories:
    - repository: niveristand-custom-device-build-tools
      type: github
      ref: main
      endpoint: nivs-custom-devices
      name: ni/niveristand-custom-device-build-tools

stages:

# =====================================================================
# WINDOWS BUILD (Stage Template)
# =====================================================================
- template: azure-templates/stages-legacy.yml@niveristand-custom-device-build-tools
  parameters:
    stageName: WindowsBuild

    lvVersionsToBuild:
      - version: '2025'
        bitness: '64bit'
      - version: '2026'
        bitness: '64bit'

    buildSteps:
      - projectLocation: 'Source\SLSC-12201 DIO.lvproj'
        buildOperation: 'ExecuteBuildSpec'
        target: 'My Computer'
        buildSpec: 'Configuration Release'

      - projectLocation: 'Source\SLSC-12201 DIO.lvproj'
        buildOperation: 'ExecuteBuildSpecAllTargets'
        target: 'All'
        buildSpec: 'Engine Release'

    releaseVersion: '27.0.0'
    buildOutputLocation: 'Built'
    archiveLocation: '\\nirvana\Measurements\VeriStandAddons\legacy\slsc_12201_custom_device'
    repoName: 'niveristand-slsc-12201-custom-device'

    packages:
      - controlFileName: 'control'
        payloadMaps:
          - installLocation: 'documents\\National Instruments\\NI VeriStand $(lvVersion)\\SLSC Plugins\\Modules'